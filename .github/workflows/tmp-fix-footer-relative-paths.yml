name: Temporary Footer Relative Path Fix

on:
  push:
    branches:
      - fix/static-contact-footer-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/static-contact-footer-hardening
          fetch-depth: 0

      - name: Restore insight pages from main and reapply static footer safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            insights/index.html \
            insights/what-is-geo-ai-search-era/index.html \
            insights/what-is-geogi/index.html \
            insights/why-ai-recommends-competitors/index.html

          python - <<'PY'
          from pathlib import Path
          import re

          configs = {
              Path('insights/index.html'): ('../', 'index.html'),
              Path('insights/what-is-geo-ai-search-era/index.html'): ('../../', '../index.html'),
              Path('insights/what-is-geogi/index.html'): ('../../', '../index.html'),
              Path('insights/why-ai-recommends-competitors/index.html'): ('../../', '../index.html'),
          }

          footer_template = '''<footer class="site-footer footer-contact-v2">
          <div class="wrap footer-v2-shell">
            <div class="footer-v2-main">
              <div class="footer-v2-brand">
                <div class="footer-v2-brandline">
                  <img class="footer-v2-logo" src="{prefix}assets/brand/geogi-app-icon.svg" alt="GeoGi" width="44" height="44">
                  <span class="footer-v2-name">GeoGi</span>
                </div>
                <p class="footer-v2-tagline">让品牌在 AI 时代被看见、被理解、被选择。</p>
                <p class="footer-v2-desc">品牌 AI 可见度诊断、竞品洞察与持续 GEO 优化。</p>
              </div>
              <div class="footer-v2-grid" aria-label="GeoGi 联系方式">
                <section class="footer-v2-card" aria-labelledby="footer-wecom-title">
                  <div class="footer-v2-card-copy"><h3 id="footer-wecom-title">企业微信</h3><p>商务咨询 / 项目沟通</p></div>
                  <img class="footer-v2-qr-image" src="{prefix}assets/contact/geogi-wecom-code.svg" alt="GeoGi 企业微信二维码" width="74" height="74">
                </section>
                <section class="footer-v2-card email" aria-labelledby="footer-email-title">
                  <div class="footer-v2-card-copy"><h3 id="footer-email-title">联系邮箱</h3><p>品牌合作与项目咨询</p></div>
                  <div class="footer-v2-email-area"><a class="footer-v2-email" href="mailto:contact@geogi.cn">contact@geogi.cn</a><a class="footer-v2-email-button" href="mailto:contact@geogi.cn">发送邮件</a></div>
                </section>
                <section class="footer-v2-card" aria-labelledby="footer-red-title">
                  <div class="footer-v2-card-copy"><h3 id="footer-red-title">小红书</h3><p>发现更多品牌洞察</p></div>
                  <img class="footer-v2-qr-image" src="{prefix}assets/contact/geogi-rednote-code.svg" alt="GeoGi 小红书二维码" width="74" height="74">
                </section>
                <section class="footer-v2-card" aria-labelledby="footer-account-title">
                  <div class="footer-v2-card-copy"><h3 id="footer-account-title">公众号</h3><p>获取最新研究与动态</p></div>
                  <img class="footer-v2-qr-image" src="{prefix}assets/contact/geogi-official-account-code.svg" alt="GeoGi 公众号二维码" width="74" height="74">
                </section>
              </div>
            </div>
            <div class="footer-v2-bottom">
              <div class="footer-v2-bottom-left"><span>© 2026 GeoGi 几何智引</span><a href="{insights_href}">GeoGi 研究中心</a></div>
              <a data-icp-filing href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer nofollow">京ICP备2026048011号-2</a>
            </div>
          </div>
          </footer>'''

          for page, (prefix, insights_href) in configs.items():
              text = page.read_text(encoding='utf-8')
              stylesheet = f'<link rel="stylesheet" href="{prefix}assets/css/footer-redesign.css?v=20260817-footer6">'
              if stylesheet not in text:
                  text = text.replace('</head>', stylesheet + '\n</head>', 1)
              text = text.replace('navigation.js?v=20260817-footer5', 'navigation.js?v=20260817-footer6')
              footer = footer_template.format(prefix=prefix, insights_href=insights_href)
              text, count = re.subn(r'<footer class="site-footer">.*?</footer>', footer, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{page}: expected one legacy footer, got {count}')
              page.write_text(text, encoding='utf-8')

          for page, (prefix, insights_href) in configs.items():
              text = page.read_text(encoding='utf-8')
              checks = [
                  f'{prefix}assets/css/footer-redesign.css?v=20260817-footer6',
                  f'{prefix}assets/brand/geogi-app-icon.svg',
                  f'{prefix}assets/contact/geogi-wecom-code.svg',
                  f'{prefix}assets/contact/geogi-rednote-code.svg',
                  f'{prefix}assets/contact/geogi-official-account-code.svg',
                  f'href="{insights_href}"',
                  'navigation.js?v=20260817-footer6',
                  'footer-contact-v2',
                  'contact@geogi.cn',
              ]
              for item in checks:
                  if item not in text:
                      raise SystemExit(f'{page}: missing {item}')
              if '..../assets/' in text or '../..../../assets/' in text or 'https://www.geogi.cn../../assets/' in text:
                  raise SystemExit(f'{page}: malformed asset path remains')
          PY

      - name: Commit rebuilt insight pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights
          git commit -m "fix: rebuild static footer paths on insight pages"
          git push origin HEAD:fix/static-contact-footer-hardening
