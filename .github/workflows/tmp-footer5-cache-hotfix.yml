name: Temporary Footer5 Cache Hotfix

on:
  push:
    branches:
      - fix/navigation-footer5-cache

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/navigation-footer5-cache
          fetch-depth: 0

      - name: Update navigation cache version
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            insights/index.html
            insights/what-is-geo-ai-search-era/index.html
            insights/what-is-geogi/index.html
            insights/why-ai-recommends-competitors/index.html
          )
          for file in "${files[@]}"; do
            sed -i 's/20260817-footer4/20260817-footer5/g' "$file"
          done

      - name: Commit exact cache-busting change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html insights
          if git diff --cached --quiet; then
            echo "No cache-version changes needed."
            exit 0
          fi
          git commit -m "fix: bust navigation cache for footer5"
          git push origin HEAD:fix/navigation-footer5-cache
