name: Live Site Smoke Check

on:
  workflow_run:
    workflows: ["Sync Gitee"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Mark live smoke pending
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"state":"pending","context":"production/live-smoke","description":"Verifying GeoGi production pages"}'
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SOURCE_SHA" \
            -d "$payload" >/dev/null

      - name: Check production pages and assets
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            url="$1"
            out="$2"
            attempts=12
            delay=10
            for attempt in $(seq 1 "$attempts"); do
              echo "Fetching $url (attempt $attempt/$attempts)"
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --retry 2 --retry-delay 2 --retry-all-errors \
                --output "$out" "$url"; then
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay"
              fi
            done
            echo "Failed to fetch $url after $attempts attempts" >&2
            return 1
          }

          check_url() {
            url="$1"
            tmp="$(mktemp)"
            fetch_with_retry "$url" "$tmp"
            rm -f "$tmp"
          }

          check_contains() {
            url="$1"
            needle="$2"
            tmp="$(mktemp)"
            fetch_with_retry "$url" "$tmp"
            if ! grep -Fq -- "$needle" "$tmp"; then
              echo "Expected content not found on $url: $needle" >&2
              rm -f "$tmp"
              return 1
            fi
            rm -f "$tmp"
          }

          slugs=(
            what-is-geo-ai-search-era
            what-is-geogi
            why-ai-recommends-competitors
            seo-vs-geo
            ai-search-brand-choice
            china-ai-platforms-brand-visibility
            ai-brand-information-consistency
            travel-industry-geo-guide
            medical-aesthetics-geo-guide
            2026-china-brand-ai-visibility-report
            geo-aeo-seo-differences
            ai-mention-citation-recommendation
            doubao-brand-visibility-observation
            deepseek-brand-visibility-observation
            tencent-yuanbao-brand-visibility-observation
            qianwen-brand-visibility-observation
            kimi-brand-visibility-observation
            brand-ai-visibility-metrics
            geo-query-set-design
            geo-retest-reproducibility
            brand-fact-source-of-truth
            geo-evidence-source-governance
            travel-agency-geo-playbook
            hotel-geo-playbook
            medical-aesthetics-trust-facts
          )

          check_url "https://www.geogi.cn/"
          check_url "https://www.geogi.cn/insights/"
          check_url "https://www.geogi.cn/insights/library/"
          check_url "https://www.geogi.cn/sitemap.xml"
          check_url "https://www.geogi.cn/data/research-index.json"
          check_url "https://www.geogi.cn/data/research-authority-library.json"
          check_url "https://www.geogi.cn/assets/js/navigation.js?v=20260817-footer6"
          check_url "https://www.geogi.cn/assets/js/research-index.js?v=20260818-v1"
          check_url "https://www.geogi.cn/assets/js/research-authority.js?v=20260819-r2"
          check_url "https://www.geogi.cn/assets/css/footer-redesign.css?v=20260817-footer6"
          check_url "https://www.geogi.cn/assets/css/research-article-refresh.css?v=20260818-r1"
          check_url "https://www.geogi.cn/assets/css/research-authority.css?v=20260819-r1"
          check_url "https://www.geogi.cn/assets/brand/geogi-logo-horizontal-navy.svg"
          check_url "https://www.geogi.cn/assets/contact/geogi-wecom-code.svg"
          check_url "https://www.geogi.cn/assets/contact/geogi-rednote-code.svg"
          check_url "https://www.geogi.cn/assets/contact/geogi-official-account-code.svg"

          for slug in "${slugs[@]}"; do
            check_url "https://www.geogi.cn/insights/$slug/"
            check_contains "https://www.geogi.cn/sitemap.xml" "/insights/$slug/"
          done

          check_contains "https://www.geogi.cn/insights/" "25 篇核心研究"
          check_contains "https://www.geogi.cn/insights/" "查看权威资料库"
          check_contains "https://www.geogi.cn/insights/" "第57次《中国互联网络发展状况统计报告》"
          check_contains "https://www.geogi.cn/insights/library/" "研究报告与权威资料"
          check_contains "https://www.geogi.cn/insights/library/" "原机构署名"
          check_contains "https://www.geogi.cn/insights/library/" "GEO: Generative Engine Optimization"
          check_contains "https://www.geogi.cn/insights/library/" "中国信息通信研究院"
          check_contains "https://www.geogi.cn/sitemap.xml" "/insights/library/"
          check_contains "https://www.geogi.cn/data/research-authority-library.json" '"review_cycle": "90d"'

          echo "Live site smoke check passed."

      - name: Report live smoke status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="GeoGi production pages verified"
          else
            state="failure"
            description="GeoGi production smoke verification failed"
          fi
          payload="$(printf '{\"state\":\"%s\",\"context\":\"production/live-smoke\",\"description\":\"%s\"}' "$state" "$description")"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SOURCE_SHA" \
            -d "$payload" >/dev/null
