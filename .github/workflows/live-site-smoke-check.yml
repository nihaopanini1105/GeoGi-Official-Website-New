name: Live Site Smoke Check

on:
  workflow_run:
    workflows: ["Sync Gitee"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Mark live smoke pending
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"state":"pending","context":"production/live-smoke","description":"Verifying GeoGi production pages"}'
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SOURCE_SHA" \
            -d "$payload" >/dev/null

      - name: Check production pages and assets
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            url="$1"
            out="$2"
            attempts=12
            delay=10
            for attempt in $(seq 1 "$attempts"); do
              echo "Fetching $url (attempt $attempt/$attempts)"
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --retry 2 --retry-delay 2 --retry-all-errors \
                --output "$out" "$url"; then
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay"
              fi
            done
            echo "Failed to fetch $url after $attempts attempts" >&2
            return 1
          }

          check_url() {
            url="$1"
            tmp="$(mktemp)"
            fetch_with_retry "$url" "$tmp"
            rm -f "$tmp"
          }

          check_contains() {
            url="$1"
            needle="$2"
            tmp="$(mktemp)"
            fetch_with_retry "$url" "$tmp"
            if ! grep -Fq -- "$needle" "$tmp"; then
              echo "Expected content not found on $url: $needle" >&2
              rm -f "$tmp"
              return 1
            fi
            rm -f "$tmp"
          }

          check_url "https://www.geogi.cn/"
          check_url "https://www.geogi.cn/insights/"
          check_url "https://www.geogi.cn/insights/what-is-geo-ai-search-era/"
          check_url "https://www.geogi.cn/insights/what-is-geogi/"
          check_url "https://www.geogi.cn/insights/why-ai-recommends-competitors/"
          check_url "https://www.geogi.cn/insights/seo-vs-geo/"
          check_url "https://www.geogi.cn/insights/ai-search-brand-choice/"
          check_url "https://www.geogi.cn/insights/china-ai-platforms-brand-visibility/"
          check_url "https://www.geogi.cn/insights/ai-brand-information-consistency/"
          check_url "https://www.geogi.cn/insights/travel-industry-geo-guide/"
          check_url "https://www.geogi.cn/insights/medical-aesthetics-geo-guide/"
          check_url "https://www.geogi.cn/insights/2026-china-brand-ai-visibility-report/"
          check_url "https://www.geogi.cn/sitemap.xml"
          check_url "https://www.geogi.cn/assets/js/navigation.js?v=20260817-footer6"
          check_url "https://www.geogi.cn/assets/css/footer-redesign.css?v=20260817-footer6"
          check_url "https://www.geogi.cn/assets/css/research-article-refresh.css?v=20260818-r1"
          check_url "https://www.geogi.cn/assets/brand/geogi-logo-horizontal-navy.svg"
          check_url "https://www.geogi.cn/assets/brand/geogi-miniprogram-code.svg"

          check_contains "https://www.geogi.cn/insights/" "2026 中国品牌 AI 可见度研究报告"
          check_contains "https://www.geogi.cn/insights/" "豆包、DeepSeek、元宝、通义、Kimi"
          check_contains "https://www.geogi.cn/insights/what-is-geo-ai-search-era/" "更新：2026-08-18"
          check_contains "https://www.geogi.cn/insights/what-is-geogi/" "更新：2026-08-18"
          check_contains "https://www.geogi.cn/insights/why-ai-recommends-competitors/" "GeoGi 方法论"
          check_contains "https://www.geogi.cn/insights/seo-vs-geo/" "SEO 之后，为什么品牌还需要关注 GEO？"
          check_contains "https://www.geogi.cn/insights/ai-search-brand-choice/" "AI 搜索时代，品牌为什么正在失去"
          check_contains "https://www.geogi.cn/insights/china-ai-platforms-brand-visibility/" "品牌为什么需要多平台观察"
          check_contains "https://www.geogi.cn/insights/ai-brand-information-consistency/" "AI 为什么会理解错一个品牌"
          check_contains "https://www.geogi.cn/insights/travel-industry-geo-guide/" "旅游行业 GEO 指南"
          check_contains "https://www.geogi.cn/insights/medical-aesthetics-geo-guide/" "医美行业 GEO 指南"
          check_contains "https://www.geogi.cn/insights/2026-china-brand-ai-visibility-report/" "2026 中国品牌 AI 可见度研究报告"
          check_contains "https://www.geogi.cn/sitemap.xml" "/insights/2026-china-brand-ai-visibility-report/"

          echo "Live site smoke check passed."

      - name: Report live smoke status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="GeoGi production pages verified"
          else
            state="failure"
            description="GeoGi production smoke verification failed"
          fi
          payload="$(printf '{\"state\":\"%s\",\"context\":\"production/live-smoke\",\"description\":\"%s\"}' "$state" "$description")"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SOURCE_SHA" \
            -d "$payload" >/dev/null
