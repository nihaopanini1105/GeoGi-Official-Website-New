name: Production Extra Verification

on:
  workflow_run:
    workflows: ["Sync Gitee"]
    types: [completed]

jobs:
  verify:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify attributed MiniProgram source on production
        run: |
          set -euo pipefail
          homepage="$(mktemp)"
          codefile="$(mktemp)"
          curl --fail --silent --show-error --location https://www.geogi.cn/ -o "$homepage"
          grep -Fq 'https://api.geogi.cn/api/source-codes/official-website.png' "$homepage"
          curl --fail --silent --show-error --location             https://api.geogi.cn/api/source-codes/official-website.png -o "$codefile"
          node - "$codefile" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2];
          const b=fs.readFileSync(p);
          const png=Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
          if (b.length < 1024) throw new Error('official website source code too small: '+b.length);
          const isPng=b.subarray(0,8).equals(png);
          const isJpeg=b.length>=3 && b[0]===0xff && b[1]===0xd8 && b[2]===0xff;
          if (!isPng && !isJpeg) throw new Error('official website source code is not a supported image');
          console.log('official_website_source_code=PASS format='+(isPng?'PNG':'JPEG')+' bytes='+b.length);
          NODE
          rm -f "$homepage" "$codefile"
          echo "Production attributed MiniProgram source verified."
